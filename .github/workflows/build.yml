name: Build NDS to APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_names:
        description: "Nucleos a tentar, em ordem (ex.: melonds melondsds)"
        required: false
        default: "melonds melondsds"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar SDK, NDK e CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Testes (AXML, ROM NDS e montagem do APK)
        run: tests/run.sh

      - name: Baixar o nucleo melonDS
        env:
          CORE_NAMES: ${{ github.event.inputs.core_names || 'melonds melondsds' }}
        run: tools/fetch_core.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compilar o gerador (inclui o player)
        run: gradle :generator:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nds-para-apk
          path: generator/build/outputs/apk/release/*.apk
          if-no-files-found: error
